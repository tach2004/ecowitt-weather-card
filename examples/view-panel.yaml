# Ecowitt Weather Card — komplette View-Konfiguration
# Bevorzugt für einen EIGENEN Wetter-Reiter.
# In Home Assistant: Dashboard bearbeiten -> Ansicht Wetter bearbeiten -> ... -> In YAML bearbeiten.
# Voraussetzung: ecowitt-weather-card.js als JavaScript-Modul installieren.
# Danach Sensoren im visuellen Karteneditor auswählen.
title: Wetter
path: wetter
icon: mdi:weather-partly-cloudy
type: panel
cards:
  - type: custom:ecowitt-weather-card
