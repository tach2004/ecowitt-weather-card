name: Check card
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Check public assets and Git history
        run: node scripts/audit-public-assets.mjs
      - name: Upload compiled card only
        uses: actions/upload-artifact@v4
        with:
          name: ecowitt-weather-card
          path: dist/ecowitt-weather-card.js
          if-no-files-found: error
